name: Test builds and sizes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dado3d-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/measure.mjs --output web-size.json
      - uses: actions/upload-artifact@v4
        with:
          name: web-size-report
          path: web-size.json

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'
      - run: npm ci
      - run: npm run cordova:prepare
      - run: npx cordova platform add android@15.1.0 --nosave
      - run: npm run android
      - run: node scripts/measure-native.mjs android platforms/android/app/build/outputs/apk/debug native-size-android.json
      - uses: actions/upload-artifact@v4
        with:
          name: dado3d-android-debug
          path: |
            platforms/android/app/build/outputs/apk/debug/app-debug.apk
            native-size-android.json

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: pod --version
      - run: npm run cordova:prepare
      - run: npx cordova platform add ios@8.1.1 --nosave
      - run: npm run ios
      - name: Archive simulator build
        run: |
          APP=$(find platforms/ios/build -name '*.app' -type d -print -quit)
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" platforms/ios/build/Dado3D-ios-simulator.zip
      - run: node scripts/measure-native.mjs ios platforms/ios/build native-size-ios.json
      - uses: actions/upload-artifact@v4
        with:
          name: dado3d-ios-simulator
          path: |
            platforms/ios/build/Dado3D-ios-simulator.zip
            native-size-ios.json

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run desktop -- --bundles nsis
      - run: node scripts/measure-native.mjs windows src-tauri/target/release/bundle/nsis native-size-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: dado3d-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            native-size-windows.json

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update
      - run: sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run desktop -- --bundles deb
      - run: node scripts/measure-native.mjs linux src-tauri/target/release/bundle native-size-linux.json
      - uses: actions/upload-artifact@v4
        with:
          name: dado3d-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            native-size-linux.json
