<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101216" />
    <meta name="color-scheme" content="dark light" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self';" />
    <title>Dado3D</title>
  </head>
  <body>
    <div class="app-shell" id="app">
      <main class="main-layout">
        <section class="stage" aria-label="Mesa de dados" id="stage">
          <div class="stage-grid" aria-hidden="true"></div>
          <div id="dice-stage" class="dice-stage" aria-hidden="true"></div>
          <details class="view-control" id="view-control">
            <summary class="icon-button view-trigger" id="view-open" aria-label="Exibição" data-i18n-aria="view" title="Exibição">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9V4h5m6 0h5v5M4 15v5h5m6 0h5v-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </summary>
            <div class="view-options" role="group" aria-label="Exibição" data-i18n-aria="view">
              <button type="button" data-view-choice="standard" data-i18n="standard" aria-pressed="true">Padrão</button>
              <button type="button" data-view-choice="compact" data-i18n="compact" aria-pressed="false">Compacto</button>
              <button type="button" data-view-choice="focus" data-i18n="only3d" aria-pressed="false">Só 3D</button>
            </div>
          </details>
          <button class="icon-button stage-settings" id="settings-open" type="button" aria-label="Preferências" title="Preferências">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.8"/><path d="m19.2 13.9 1.1.9-1.5 2.6-1.4-.5a8 8 0 0 1-1.5.9l-.3 1.5h-3l-.3-1.5a8 8 0 0 1-1.6-.9l-1.4.5-1.5-2.6 1.1-.9a8 8 0 0 1 0-1.8l-1.1-.9 1.5-2.6 1.4.5a8 8 0 0 1 1.6-.9l.3-1.5h3l.3 1.5a8 8 0 0 1 1.5.9l1.4-.5 1.5 2.6-1.1.9a8 8 0 0 1 0 1.8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" transform="translate(-1 -1)"/></svg>
          </button>
          <div class="stage-placeholder" id="stage-placeholder">
            <div class="placeholder-die" aria-hidden="true">20</div>
            <p id="stage-hint" data-i18n="tapDice">Toque nos dados para montar sua rolagem</p>
          </div>
          <details class="stage-result" id="stage-result" hidden>
            <summary class="stage-result-summary" dir="ltr">
              <span class="sr-only" data-i18n="result">RESULTADO</span>
              <span class="stage-result-notation" id="result-notation" dir="ltr"></span>
              <span class="stage-result-equals" aria-hidden="true">=</span>
              <strong class="stage-result-main" id="result-main" aria-live="polite"></strong>
              <svg class="stage-result-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </summary>
            <div class="stage-result-breakdown">
              <div class="stage-result-notice" id="result-notice" hidden></div>
              <div class="stage-result-detail" id="result-detail"></div>
            </div>
          </details>
        </section>

        <section class="control-panel" aria-label="Controles de rolagem">
          <div class="composer">
            <div class="input-switch" role="group">
              <button class="mode-button" type="button" data-mode-choice="pool" aria-pressed="true"><span data-i18n="pool">Pool</span><small id="stack-summary" class="stack-summary" hidden></small></button>
              <button class="mode-button" type="button" data-mode-choice="notation" aria-pressed="false" data-i18n="expression">Notação</button>
            </div>
            <div class="mode-panel" id="notation-panel" hidden>
              <label class="sr-only" for="notation" data-i18n="expression">Notação</label>
              <div class="notation-row">
                <input id="notation" class="notation-input" type="text" inputmode="text" dir="ltr" maxlength="300" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="2d6+d20" aria-describedby="input-error" />
                <button class="text-button" id="clear" type="button" data-i18n="clear">Limpar</button>
              </div>
            </div>
            <div class="mode-panel" id="pool-panel">
              <div class="dice-palette" id="dice-palette" role="group" aria-label="Adicionar dados">
                <button class="die-button" type="button" data-die="4"><span class="die-shape shape-d4">4</span><span>d4</span><small class="die-count" hidden></small></button>
                <button class="die-button" type="button" data-die="6"><span class="die-shape shape-d6">6</span><span>d6</span><small class="die-count" hidden></small></button>
                <button class="die-button" type="button" data-die="8"><span class="die-shape shape-d8">8</span><span>d8</span><small class="die-count" hidden></small></button>
                <button class="die-button" type="button" data-die="10"><span class="die-shape shape-d10">10</span><span>d10</span><small class="die-count" hidden></small></button>
                <button class="die-button" type="button" data-die="12"><span class="die-shape shape-d12">12</span><span>d12</span><small class="die-count" hidden></small></button>
                <button class="die-button" type="button" data-die="20"><span class="die-shape shape-d20">20</span><span>d20</span><small class="die-count" hidden></small></button>
                <button class="die-button" type="button" data-die="100"><span class="die-shape shape-d100">%</span><span>d100</span><small class="die-count" hidden></small></button>
                <button class="die-button" type="button" data-die="2"><span class="die-shape shape-d2">2</span><span>d2</span><small class="die-count" hidden></small></button>
              </div>
              <div class="stack-chips" id="stack-chips" aria-live="polite"></div>
              <div class="pool-expression" id="pool-expression" dir="ltr" hidden></div>
            </div>
            <div class="input-error" id="input-error" role="alert" hidden></div>
            <button class="compact-edit" id="compact-edit" type="button" aria-label="Editar dados" data-i18n-aria="edit" title="Editar dados">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m4 16-.5 4.5L8 20l10.8-10.8-4-4L4 16Zm9.7-9.7 4 4M15.8 4.2l1.1-1.1a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8l-1.1 1.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="roll-button" id="roll" type="button" disabled>
              <span data-i18n="roll">Rolar dados</span>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
          </div>
        </section>
      </main>
    </div>

    <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
      <form method="dialog" class="settings-content">
        <div class="settings-heading"><h2 id="settings-title" data-i18n="settings">Preferências</h2><button class="icon-button" type="submit" aria-label="Fechar" data-i18n-aria="close">×</button></div>
        <div class="setting-group">
          <span class="setting-label" data-i18n="theme">Tema</span>
          <div class="segmented" role="group" aria-label="Tema">
            <button type="button" data-theme-choice="dark" data-i18n="dark">Escuro</button>
            <button type="button" data-theme-choice="light" data-i18n="light">Claro</button>
          </div>
        </div>
        <div class="setting-group">
          <span class="setting-label" data-i18n="diceColor">Cor dos dados</span>
          <div class="color-options" id="color-options" role="group" aria-label="Cor dos dados">
            <button type="button" class="color-option" data-color="violet" style="--swatch:#a48bff" aria-label="Cor 1"></button>
            <button type="button" class="color-option" data-color="blue" style="--swatch:#67a7ff" aria-label="Cor 2"></button>
            <button type="button" class="color-option" data-color="mint" style="--swatch:#64d6ac" aria-label="Cor 3"></button>
            <button type="button" class="color-option" data-color="amber" style="--swatch:#f2b76b" aria-label="Cor 4"></button>
          </div>
        </div>
        <div class="setting-group">
          <label class="setting-label" for="language" data-i18n="language">Idioma</label>
          <select id="language" class="language-select"></select>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
